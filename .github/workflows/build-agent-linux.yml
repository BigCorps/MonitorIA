name: Build MonitorIA Agent (Linux)

on:
  workflow_dispatch:
  push:
    tags:
      - "agent-v*"

permissions:
  contents: write

env:
  AGENT_VERSION: "1.0.1"

jobs:
  build-linux:
    name: Pacote Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            bun_target: bun-linux-x64-baseline
            ffmpeg_asset: monitoria-ffmpeg-linux-x64-v1.tar.gz
            ffmpeg_sha256: d27ef4e034b31e0ddfeebf16af54742d50455139e57517da15207113665a78f8
          - arch: arm64
            runner: ubuntu-24.04-arm
            bun_target: bun-linux-aarch64
            ffmpeg_asset: monitoria-ffmpeg-linux-arm64-v1.tar.gz
            ffmpeg_sha256: c8c1cf0be6ca8f3b913b2733aa817743d9ea8211e36ef81075129f112d72f062

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Instalar dependências
        working-directory: agent
        run: bun install --frozen-lockfile

      - name: Verificar TypeScript
        working-directory: agent
        run: bun run check

      - name: Compilar o Agent
        working-directory: agent
        run: |
          bun build ./src/index.ts --compile \
            --no-compile-autoload-dotenv \
            --no-compile-autoload-bunfig \
            --target=${{ matrix.bun_target }} \
            --outfile ./dist/monitoria-agent

      - name: Autoteste
        working-directory: agent
        run: |
          chmod +x dist/monitoria-agent
          ./dist/monitoria-agent self-test

      - name: Baixar e conferir FFmpeg
        run: |
          set -euo pipefail
          BASE="https://github.com/BigCorps/MonitorIA/releases/download/agent-deps-v1"
          curl -fsSL -o ffmpeg.tar.gz "${BASE}/${{ matrix.ffmpeg_asset }}"
          HASH="$(sha256sum ffmpeg.tar.gz | cut -d' ' -f1)"
          echo "SHA256: ${HASH}"
          test "${HASH}" = "${{ matrix.ffmpeg_sha256 }}" || {
            echo "SHA256 divergente. Esperado ${{ matrix.ffmpeg_sha256 }}, obtido ${HASH}" >&2
            exit 1
          }
          mkdir -p ffmpeg-tmp && tar xzf ffmpeg.tar.gz -C ffmpeg-tmp

      - name: Montar o pacote
        run: |
          set -euo pipefail
          OUT="monitoria-agent-linux-${{ matrix.arch }}"
          mkdir -p "$OUT"

          cp agent/dist/monitoria-agent "$OUT/"
          cp ffmpeg-tmp/ffmpeg ffmpeg-tmp/ffprobe "$OUT/"
          mkdir -p "$OUT/lib"
          cp -a ffmpeg-tmp/lib/. "$OUT/lib/"
          cp packaging/linux/monitoria-agent.service "$OUT/"
          cp packaging/linux/install.sh "$OUT/"
          chmod +x "$OUT/install.sh" "$OUT/monitoria-agent" "$OUT/ffmpeg" "$OUT/ffprobe"

          find ffmpeg-tmp -name 'LICENSE*' -maxdepth 2 -exec cp {} "$OUT/LICENSE.txt" \; || true

          cat > "$OUT/FFMPEG-ORIGEM.txt" <<EOF
          FFmpeg redistribuído sem modificação.

          Origem : https://github.com/BigCorps/MonitorIA/releases/download/agent-deps-v1/${{ matrix.ffmpeg_asset }}
          Licença: LGPL (build sem componentes GPL)
          Fonte  : https://github.com/BtbN/FFmpeg-Builds
          Upstream: https://git.ffmpeg.org/ffmpeg.git
          EOF

          tar czf "${OUT}.tar.gz" "$OUT"
          echo "Pacote: $(du -h "${OUT}.tar.gz" | cut -f1)"

      - name: Validar pacote Linux instalado
        run: |
          set -euo pipefail
          OUT="monitoria-agent-linux-${{ matrix.arch }}"

          sudo "${OUT}/install.sh" </dev/null

          systemd-analyze verify /etc/systemd/system/monitoria-agent.service

          systemctl is-enabled --quiet monitoria-agent.service
          systemctl is-active --quiet monitoria-agent.service
          test -x /opt/monitoria/monitoria-agent
          test -x /opt/monitoria/ffmpeg/ffmpeg
          test -x /opt/monitoria/ffmpeg/ffprobe
          test -d /var/lib/monitoria
          test "$(stat -c '%a' /var/lib/monitoria)" = "700"
          test "$(stat -c '%U' /var/lib/monitoria)" = "monitoria"

          LD_LIBRARY_PATH=/opt/monitoria/ffmpeg/lib /opt/monitoria/ffmpeg/ffmpeg -version | head -n 1
          LD_LIBRARY_PATH=/opt/monitoria/ffmpeg/lib /opt/monitoria/ffmpeg/ffprobe -version | head -n 1

          for _ in $(seq 1 30); do
            if sudo -u monitoria /opt/monitoria/monitoria-agent status >/tmp/monitoria-status.txt 2>&1; then
              break
            fi
            sleep 0.5
          done
          cat /tmp/monitoria-status.txt
          grep -q "MonitorIA Agent v${AGENT_VERSION}" /tmp/monitoria-status.txt
          grep -q "Pareado: não" /tmp/monitoria-status.txt

          sudo systemctl restart monitoria-agent.service
          sleep 1
          systemctl is-active --quiet monitoria-agent.service
          sudo -u monitoria /opt/monitoria/monitoria-agent status >/tmp/monitoria-status-after-restart.txt
          grep -q "Pareado: não" /tmp/monitoria-status-after-restart.txt

          sudo "${OUT}/install.sh" --uninstall

          ! systemctl is-active --quiet monitoria-agent.service
          ! systemctl is-enabled --quiet monitoria-agent.service 2>/dev/null
          test ! -e /etc/systemd/system/monitoria-agent.service
          test ! -e /opt/monitoria
          test ! -e /var/lib/monitoria
          ! id -u monitoria >/dev/null 2>&1

          echo "Teste Linux completo aprovado para ${{ matrix.arch }}."

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: monitoria-agent-linux-${{ matrix.arch }}
          path: monitoria-agent-linux-*.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/agent-v')
        uses: softprops/action-gh-release@v2
        with:
          files: monitoria-agent-linux-*.tar.gz
          fail_on_unmatched_files: true
