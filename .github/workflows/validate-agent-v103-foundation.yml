name: Validate MonitorIA 1.0.3 Foundation

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "agent/**"
      - "app/api/agent/v103/**"
      - "app/api/agent/clips/**"
      - "supabase/migrations/*v103.sql"
      - "test/agent-0103-*.test.ts"
      - ".github/workflows/validate-agent-v103-foundation.yml"
      - "docs/MONITORIA-1.0.3-PLANO-MESTRE.md"
      - "packaging/linux/**"
  pull_request:
    paths:
      - "agent/**"
      - "app/api/agent/v103/**"
      - "app/api/agent/clips/**"
      - "supabase/migrations/*v103.sql"
      - "test/agent-0103-*.test.ts"
      - ".github/workflows/validate-agent-v103-foundation.yml"
      - "docs/MONITORIA-1.0.3-PLANO-MESTRE.md"
      - "packaging/linux/**"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true
      - run: npm ci
      - run: npx tsc --noEmit -p agent/tsconfig.json
      - name: Fundação 1.0.3
        run: node --import tsx --test test/agent-0103-foundation.test.ts
      - name: Operação e segurança 1.0.3
        run: node --import tsx --test test/agent-0103-operational.test.ts
      - name: Integridade de vídeo 1.0.3
        run: node --import tsx --test test/agent-0103-video-integrity.test.ts
      - name: Pinning antecipado de vídeo 1.0.3
        run: node --import tsx --test test/agent-0103-early-pinning.test.ts
      - name: Coerência temporal de evidências 1.0.3
        run: node --import tsx --test test/agent-0103-evidence-coherence.test.ts
      - name: Prioridade e preservação de evidências 1.0.3
        run: node --import tsx --test test/agent-0103-evidence-priority.test.ts
      - name: Regressões 1.0.2 preservadas
        run: |
          node --import tsx --test test/agent-0102-production.test.ts
          node --import tsx --test test/agent-0102-http-redirect.test.ts

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-download-url: "https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-windows-x64-baseline.zip"
          no-cache: true
      - run: npm ci
      - name: Compilar Core 1.0.3 Windows
        working-directory: agent
        shell: pwsh
        run: |
          bun build ./src/index-v103.ts --compile `
            --no-compile-autoload-dotenv `
            --no-compile-autoload-bunfig `
            --windows-icon=../installer/monitoria.ico `
            --windows-title="MonitorIA Agent" `
            --windows-publisher="BIGCORPS TECNOLOGIA LTA" `
            --windows-version=1.0.3 `
            --outfile ./dist/monitoria-agent-v103-foundation.exe
          & ./dist/monitoria-agent-v103-foundation.exe self-test
          if ($LASTEXITCODE -ne 0) { throw "Autoteste 1.0.3 falhou." }

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            target: bun-linux-x64-baseline
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: bun-linux-aarch64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true
      - run: npm ci
      - name: Compilar Core 1.0.3 Linux
        working-directory: agent
        run: |
          bun build ./src/index-v103.ts --compile \
            --no-compile-autoload-dotenv \
            --no-compile-autoload-bunfig \
            --target=${{ matrix.target }} \
            --outfile ./dist/monitoria-agent-v103-foundation
          chmod +x ./dist/monitoria-agent-v103-foundation
          ./dist/monitoria-agent-v103-foundation self-test
      - name: Validar contrato systemd já existente
        run: |
          grep -q 'ExecStart=/opt/monitoria/monitoria-agent service' packaging/linux/monitoria-agent.service
          grep -q 'Restart=always' packaging/linux/monitoria-agent.service
          grep -q 'StateDirectory=monitoria' packaging/linux/monitoria-agent.service
