name: Build MonitorIA 1.0.3 Release Candidate

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: "Identificador curto da RC (ex.: rc1)"
        required: true
        default: "rc1"
        type: string

permissions:
  contents: read

concurrency:
  group: monitoria-v103-release-candidate
  cancel-in-progress: false

env:
  AGENT_VERSION: "1.0.3"
  BUN_VERSION: "1.3.14"
  PUBLISHER_NAME: "BIGCORPS TECNOLOGIA LTA"
  FFMPEG_WINDOWS_URL: "https://github.com/BigCorps/MonitorIA/releases/download/agent-deps-v1/monitoria-ffmpeg-win64-lgpl-shared-v1.zip"
  FFMPEG_WINDOWS_SHA256: "e12b6bab3636a9056803cbfc107a4bc724504c1c75a7bbc8aa43c876fb59d02b"
  WINSW_URL: "https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW.NET461.exe"
  WINSW_SHA256: "b5066b7bbdfba1293e5d15cda3caaea88fbeab35bd5b38c41c913d492aadfc4f"

jobs:
  contract:
    name: RC 1.0.3 Contract + Regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true
      - name: Validar identificador da RC
        shell: bash
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE" =~ ^[a-z0-9][a-z0-9._-]{0,20}$ ]]; then
            echo "Identificador inválido. Use somente a-z, 0-9, ponto, hífen e underscore (máx. 21 caracteres)." >&2
            exit 1
          fi

      - run: npm ci
      - name: TypeScript do Agent
        run: npx tsc --noEmit -p agent/tsconfig.json
      - name: TypeScript web
        run: npx tsc --noEmit
      - name: Contrato da Release Candidate
        run: node --import tsx --test test/agent-0103-release-candidate-contract.test.ts
      - name: Regressões funcionais 1.0.3
        run: |
          node --import tsx --test test/agent-0103-foundation.test.ts
          node --import tsx --test test/agent-0103-operational.test.ts
          node --import tsx --test test/agent-0103-video-integrity.test.ts
          node --import tsx --test test/agent-0103-early-pinning.test.ts
          node --import tsx --test test/agent-0103-evidence-coherence.test.ts
          node --import tsx --test test/agent-0103-evidence-priority.test.ts
          node --import tsx --test test/agent-0103-evidence-gap.test.ts
          node --import tsx --test test/agent-0103-tray-contract.test.ts
          node --import tsx --test test/agent-0103-store-desktop-host.test.ts
          node --import tsx --test test/agent-0103-store-install-experience.test.ts
      - name: Regressões 1.0.2 preservadas
        run: |
          node --import tsx --test test/agent-0102-production.test.ts
          node --import tsx --test test/agent-0102-http-redirect.test.ts

  windows:
    name: Windows 24/7 + Store signed RC
    needs: contract
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-download-url: "https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-windows-x64-baseline.zip"
          no-cache: true
      - run: npm ci

      - name: Validar credenciais obrigatórias de assinatura
        shell: pwsh
        env:
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:ESIGNER_USERNAME)) { $missing += "ESIGNER_USERNAME" }
          if ([string]::IsNullOrWhiteSpace($env:ESIGNER_PASSWORD)) { $missing += "ESIGNER_PASSWORD" }
          if ([string]::IsNullOrWhiteSpace($env:ESIGNER_CREDENTIAL_ID)) { $missing += "ESIGNER_CREDENTIAL_ID" }
          if ([string]::IsNullOrWhiteSpace($env:ESIGNER_TOTP_SECRET)) { $missing += "ESIGNER_TOTP_SECRET" }
          if ($missing.Count -gt 0) {
            throw "A RC Windows exige assinatura. Segredos ausentes: $($missing -join ', ')"
          }

      - name: Compilar um único Core Windows 1.0.3
        working-directory: agent
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          bun build ./src/index-v103.ts --compile `
            --no-compile-autoload-dotenv `
            --no-compile-autoload-bunfig `
            --windows-icon=../installer/monitoria.ico `
            --windows-title="MonitorIA Agent" `
            --windows-publisher="BIGCORPS TECNOLOGIA LTA" `
            --windows-version=1.0.3 `
            --windows-description="Monitoramento de câmeras MonitorIA" `
            --outfile ./dist/monitoria-agent.exe

          & ./dist/monitoria-agent.exe self-test
          if ($LASTEXITCODE -ne 0) { throw "Autoteste do Core Windows 1.0.3 falhou." }

      - name: Compilar DPAPI, tray 24/7, Desktop Host e consentimento Store
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudio = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if ([string]::IsNullOrWhiteSpace($visualStudio)) {
            throw "Ferramentas C++ do Visual Studio não encontradas."
          }

          $vcvars = Join-Path $visualStudio "VC\Auxiliary\Build\vcvars64.bat"
          $native = Join-Path $env:GITHUB_WORKSPACE "agent\native"
          $script = Join-Path $env:RUNNER_TEMP "build-monitoria-v103-native.cmd"

          @"
          @echo off
          call "$vcvars"
          if errorlevel 1 exit /b 1
          cd /d "$native"
          cl.exe /nologo /O2 /W4 /utf-8 /DUNICODE /D_UNICODE dpapi.c /Fe:..\..\build\monitoria-dpapi.exe Crypt32.lib
          if errorlevel 1 exit /b 1
          rc.exe /nologo /fo ..\..\build\monitoria-tray.res tray.rc
          if errorlevel 1 exit /b 1
          cl.exe /nologo /O2 /W4 /utf-8 /DUNICODE /D_UNICODE tray.c ..\..\build\monitoria-tray.res /Fe:..\..\build\monitoria-tray.exe Advapi32.lib Shell32.lib User32.lib /link /SUBSYSTEM:WINDOWS
          if errorlevel 1 exit /b 1
          rc.exe /nologo /fo ..\..\build\monitoria-desktop.res desktop-host.rc
          if errorlevel 1 exit /b 1
          cl.exe /nologo /O2 /W4 /utf-8 /DUNICODE /D_UNICODE desktop-host.c ..\..\build\monitoria-desktop.res /Fe:..\..\build\monitoria-desktop.exe Shell32.lib User32.lib /link /SUBSYSTEM:WINDOWS
          if errorlevel 1 exit /b 1
          rc.exe /nologo /fo ..\..\build\monitoria-store-launcher.res store-startup-consent.rc
          if errorlevel 1 exit /b 1
          cl.exe /nologo /O2 /W4 /utf-8 /DUNICODE /D_UNICODE store-startup-consent.c ..\..\build\monitoria-store-launcher.res /Fe:..\..\build\monitoria-store-launcher.exe Advapi32.lib Shell32.lib User32.lib /link /SUBSYSTEM:WINDOWS
          if errorlevel 1 exit /b 1
          "@ | Set-Content -Encoding ascii $script

          & cmd.exe /d /c $script
          if ($LASTEXITCODE -ne 0) { throw "Falha ao compilar os hosts nativos da 1.0.3." }

          if ((Get-Item build\monitoria-dpapi.exe).Length -lt 10000) { throw "DPAPI incompleto." }
          if ((Get-Item build\monitoria-tray.exe).Length -lt 15000) { throw "Tray incompleto." }
          if ((Get-Item build\monitoria-desktop.exe).Length -lt 15000) { throw "Desktop Host incompleto." }
          if ((Get-Item build\monitoria-store-launcher.exe).Length -lt 12000) { throw "Launcher de consentimento Store incompleto." }


          # Regressão real do bug de mojibake observado no RC Store.
          # Não basta o fonte usar APIs W: o MSVC precisa decodificar o .c como UTF-8.
          function Test-ByteSequence {
            param(
              [byte[]]$Haystack,
              [byte[]]$Needle
            )

            if ($Needle.Length -eq 0 -or $Haystack.Length -lt $Needle.Length) {
              return $false
            }

            for ($i = 0; $i -le ($Haystack.Length - $Needle.Length); $i++) {
              $matches = $true
              for ($j = 0; $j -lt $Needle.Length; $j++) {
                if ($Haystack[$i + $j] -ne $Needle[$j]) {
                  $matches = $false
                  break
                }
              }
              if ($matches) { return $true }
            }

            return $false
          }

          function Test-Utf16Literal {
            param(
              [string]$Path,
              [string]$Text
            )

            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $Path))
            $needleBytes = [Text.Encoding]::Unicode.GetBytes($Text)
            return Test-ByteSequence -Haystack $bytes -Needle $needleBytes
          }

          if (-not (Test-Utf16Literal "build\monitoria-desktop.exe" "código de conexão")) {
            throw "Desktop Host compilado sem os textos Unicode corretos."
          }
          if (Test-Utf16Literal "build\monitoria-desktop.exe" "cÃ³digo de conexÃ£o") {
            throw "Desktop Host contém mojibake UTF-8/ANSI."
          }
          if (-not (Test-Utf16Literal "build\monitoria-store-launcher.exe" "inicialização automática")) {
            throw "Launcher Store compilado sem os textos Unicode corretos."
          }
          if (Test-Utf16Literal "build\monitoria-store-launcher.exe" "inicializaÃ§Ã£o automÃ¡tica") {
            throw "Launcher Store contém mojibake UTF-8/ANSI."
          }
          if (-not (Test-Utf16Literal "build\monitoria-tray.exe" "atenção: serviço parado")) {
            throw "Tray 24/7 compilado sem os textos Unicode corretos."
          }
          if (Test-Utf16Literal "build\monitoria-tray.exe" "atenÃ§Ã£o: serviÃ§o parado") {
            throw "Tray 24/7 contém mojibake UTF-8/ANSI."
          }

      - name: Autotestes dos hosts Windows
        shell: pwsh
        run: |
          $tray = Start-Process -FilePath (Resolve-Path "build\monitoria-tray.exe") -ArgumentList "--self-test" -Wait -PassThru
          if ($tray.ExitCode -ne 0) { throw "Self-test do tray falhou: $($tray.ExitCode)" }

          Copy-Item agent\dist\monitoria-agent.exe build\monitoria-agent.exe -Force
          $desktop = Start-Process `
            -FilePath (Resolve-Path "build\monitoria-desktop.exe") `
            -ArgumentList "--self-test" `
            -WorkingDirectory (Resolve-Path "build") `
            -Wait `
            -PassThru
          if ($desktop.ExitCode -ne 0) { throw "Self-test do Desktop Host falhou: $($desktop.ExitCode)" }

          $storeLauncher = Start-Process `
            -FilePath (Resolve-Path "build\monitoria-store-launcher.exe") `
            -ArgumentList "--self-test" `
            -WorkingDirectory (Resolve-Path "build") `
            -Wait `
            -PassThru
          if ($storeLauncher.ExitCode -ne 0) { throw "Self-test do launcher Store falhou: $($storeLauncher.ExitCode)" }

      - name: Baixar e conferir FFmpeg LGPL Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\ffmpeg | Out-Null
          Invoke-WebRequest -Uri $env:FFMPEG_WINDOWS_URL -OutFile ffmpeg.zip
          $hash = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:FFMPEG_WINDOWS_SHA256) {
            throw "SHA256 do FFmpeg divergente. Esperado $env:FFMPEG_WINDOWS_SHA256, obtido $hash."
          }

          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          foreach ($name in @("ffmpeg.exe", "ffprobe.exe")) {
            $source = Get-ChildItem ffmpeg-tmp -Recurse -Filter $name | Select-Object -First 1
            if (-not $source) { throw "$name não encontrado no bundle FFmpeg." }
            Copy-Item $source.FullName "build\ffmpeg\$name"
          }
          Get-ChildItem ffmpeg-tmp -Recurse -Filter *.dll | ForEach-Object {
            Copy-Item $_.FullName "build\ffmpeg\$($_.Name)"
          }
          $license = Get-ChildItem ffmpeg-tmp -Recurse -Filter LICENSE.txt | Select-Object -First 1
          if (-not $license) { throw "LICENSE.txt do FFmpeg não encontrado." }
          Copy-Item $license.FullName build\ffmpeg\LICENSE.txt
          @"
          FFmpeg redistribuído sem modificação.

          Origem : $env:FFMPEG_WINDOWS_URL
          SHA256 : $env:FFMPEG_WINDOWS_SHA256
          Licença: LGPL (build sem componentes GPL)
          Fonte  : https://github.com/BtbN/FFmpeg-Builds
          Upstream: https://git.ffmpeg.org/ffmpeg.git
          "@ | Out-File -Encoding utf8 build\ffmpeg\FFMPEG-ORIGEM.txt

          $encoders = & build\ffmpeg\ffmpeg.exe -hide_banner -encoders 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg não iniciou corretamente." }
          if ($encoders -notmatch 'libopenh264') { throw "FFmpeg LGPL sem libopenh264." }
          $buildConf = & build\ffmpeg\ffmpeg.exe -hide_banner -buildconf 2>&1 | Out-String
          if ($buildConf -match '--enable-gpl') { throw "Bundle FFmpeg inesperadamente GPL." }

          $vendorTargets = @(
            "build\ffmpeg\ffmpeg.exe",
            "build\ffmpeg\ffprobe.exe"
          ) + @(Get-ChildItem build\ffmpeg -File -Filter *.dll | ForEach-Object { $_.FullName })
          foreach ($target in $vendorTargets) {
            $sig = Get-AuthenticodeSignature $target
            if ($sig.Status -ne 'Valid') {
              throw "Dependência FFmpeg sem Authenticode válido: $target ($($sig.Status))"
            }
          }

      - name: Baixar e conferir WinSW para a edição 24/7
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:WINSW_URL -OutFile build\monitoria-service.exe
          $hash = (Get-FileHash build\monitoria-service.exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:WINSW_SHA256) {
            throw "SHA256 do WinSW divergente. Esperado $env:WINSW_SHA256, obtido $hash."
          }

      - name: Preparar binários Windows para assinatura
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path sign-stage | Out-Null
          Copy-Item agent\dist\monitoria-agent.exe sign-stage\ -Force
          Copy-Item build\monitoria-dpapi.exe sign-stage\ -Force
          Copy-Item build\monitoria-tray.exe sign-stage\ -Force
          Copy-Item build\monitoria-desktop.exe sign-stage\ -Force
          Copy-Item build\monitoria-store-launcher.exe sign-stage\ -Force
          Copy-Item build\monitoria-service.exe sign-stage\ -Force

      - name: Assinar Core e hosts Windows
        uses: sslcom/esigner-codesign@v1.3.2
        with:
          command: batch_sign
          username: ${{ secrets.ESIGNER_USERNAME }}
          password: ${{ secrets.ESIGNER_PASSWORD }}
          credential_id: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ESIGNER_TOTP_SECRET }}
          dir_path: ${{ github.workspace }}\sign-stage
          output_path: ${{ github.workspace }}\sign-stage-signed
          malware_block: true
          environment_name: PROD

      - name: Repor binários assinados e validar Authenticode
        shell: pwsh
        run: |
          Copy-Item sign-stage-signed\monitoria-agent.exe agent\dist\monitoria-agent.exe -Force
          foreach ($name in @("monitoria-dpapi.exe", "monitoria-tray.exe", "monitoria-desktop.exe", "monitoria-store-launcher.exe", "monitoria-service.exe")) {
            Copy-Item "sign-stage-signed\$name" "build\$name" -Force
          }

          foreach ($target in @(
            "agent\dist\monitoria-agent.exe",
            "build\monitoria-dpapi.exe",
            "build\monitoria-tray.exe",
            "build\monitoria-desktop.exe",
            "build\monitoria-store-launcher.exe",
            "build\monitoria-service.exe"
          )) {
            $sig = Get-AuthenticodeSignature $target
            if ($sig.Status -ne 'Valid') { throw "Assinatura inválida: $target ($($sig.Status))" }
            if (-not $sig.TimeStamperCertificate) { throw "Sem carimbo de tempo: $target" }
          }

          & agent\dist\monitoria-agent.exe self-test
          if ($LASTEXITCODE -ne 0) { throw "Core assinado falhou no self-test." }

          $dpapi = Start-Process -FilePath (Resolve-Path "build\monitoria-dpapi.exe") -Wait -PassThru
          if ($dpapi.ExitCode -ne 2) { throw "DPAPI assinado não retornou o código esperado 2 sem argumentos: $($dpapi.ExitCode)" }

          $tray = Start-Process -FilePath (Resolve-Path "build\monitoria-tray.exe") -ArgumentList "--self-test" -Wait -PassThru
          if ($tray.ExitCode -ne 0) { throw "Tray assinado falhou no self-test: $($tray.ExitCode)" }

          Copy-Item agent\dist\monitoria-agent.exe build\monitoria-agent.exe -Force
          $desktop = Start-Process `
            -FilePath (Resolve-Path "build\monitoria-desktop.exe") `
            -ArgumentList "--self-test" `
            -WorkingDirectory (Resolve-Path "build") `
            -Wait `
            -PassThru
          if ($desktop.ExitCode -ne 0) { throw "Desktop Host assinado falhou no self-test: $($desktop.ExitCode)" }

          $storeLauncher = Start-Process `
            -FilePath (Resolve-Path "build\monitoria-store-launcher.exe") `
            -ArgumentList "--self-test" `
            -WorkingDirectory (Resolve-Path "build") `
            -Wait `
            -PassThru
          if ($storeLauncher.ExitCode -ne 0) { throw "Launcher Store assinado falhou no self-test: $($storeLauncher.ExitCode)" }

      - name: Guardas de separação 24/7 x Store
        shell: pwsh
        run: |
          $desktopSource = Get-Content agent\native\desktop-host.c -Raw
          foreach ($forbidden in @(
            "OpenSCManager", "OpenService", "CreateService", "SERVICE_CONTROL",
            "monitoria-service.exe", "monitoria-service.xml", "WinSW", "sc.exe", "MonitorIAAgent"
          )) {
            if ($desktopSource -match [regex]::Escape($forbidden)) {
              throw "Desktop Host contém referência proibida do host 24/7: $forbidden"
            }
          }

          $startupSource = Get-Content agent\native\store-startup-consent.c -Raw
          foreach ($forbidden in @(
            "OpenSCManager", "OpenService", "CreateService", "SERVICE_CONTROL",
            "monitoria-service.exe", "monitoria-service.xml", "WinSW", "sc.exe", "MonitorIAAgent"
          )) {
            if ($startupSource -match [regex]::Escape($forbidden)) {
              throw "Launcher Store contém referência proibida do host 24/7: $forbidden"
            }
          }

          $storeIss = Get-Content installer\monitoria-store-v103.iss -Raw
          foreach ($forbidden in @("monitoria-service.exe", "monitoria-service.xml", "WinSW", "sc.exe", "MonitorIAAgent")) {
            if ($storeIss -match [regex]::Escape($forbidden)) {
              throw "Instalador Store contém referência proibida: $forbidden"
            }
          }
          if ($storeIss -notmatch 'PrivilegesRequired=lowest') { throw "Store não está per-user/lowest." }
          if ($storeIss -notmatch 'monitoria-desktop.exe') { throw "Store sem Desktop Host." }
          if ($storeIss -notmatch 'monitoria-store-launcher.exe') { throw "Store sem launcher de consentimento." }
          if ($storeIss -match 'ValueType:\s*string;[\s\S]*ValueName:\s*"MonitorIA";[\s\S]*ValueData:') {
            throw "Instalador Store voltou a habilitar autostart sem consentimento."
          }
          if ($storeIss -notmatch 'deletevalue dontcreatekey noerror') {
            throw "Store não remove o autostart legado durante upgrade."
          }

          $serviceIss = Get-Content installer\monitoria-service-v103.iss -Raw
          if ($serviceIss -notmatch 'monitoria-tray.exe') { throw "24/7 sem tray companion." }
          if ($serviceIss -notmatch '#include "monitoria.iss"') { throw "24/7 deixou de preservar o instalador homologado." }

      - name: Localizar Inno Setup
        id: inno
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup não encontrado." }
          "path=$iscc" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Compilar e assinar Setup + uninstaller dos dois canais Windows
        shell: pwsh
        env:
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
        run: |
          $signWrapper = Join-Path $env:GITHUB_WORKSPACE "scripts\sign-inno-authenticode.ps1"
          if (-not (Test-Path -LiteralPath $signWrapper)) {
            throw "Wrapper de assinatura Inno não encontrado: $signWrapper"
          }

          if (
            [string]::IsNullOrWhiteSpace($env:CODE_SIGN_TOOL_PATH) -and
            [string]::IsNullOrWhiteSpace($env:CODESIGNTOOL_PATH)
          ) {
            throw "CodeSignTool da SSL.com não foi inicializado antes da compilação Inno."
          }

          $pwsh = (Get-Command pwsh.exe -ErrorAction Stop).Source
          $signTool =
            'monitoria=$q' + $pwsh +
            '$q -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $q' +
            $signWrapper + '$q $f'

          $isccArgs = @(
            "/DAppVersion=1.0.3",
            "/DSignCommand=1",
            "/S$signTool"
          )

          $signLog = Join-Path $env:RUNNER_TEMP "monitoria-inno-signatures.jsonl"
          Remove-Item -LiteralPath $signLog -Force -ErrorAction SilentlyContinue

          $env:MONITORIA_SIGN_CONTEXT = "windows-247"
          & "${{ steps.inno.outputs.path }}" @isccArgs installer\monitoria-service-v103.iss
          if ($LASTEXITCODE -ne 0) { throw "Falha ao compilar/assinar MonitorIA 24/7 1.0.3." }

          $env:MONITORIA_SIGN_CONTEXT = "windows-store"
          & "${{ steps.inno.outputs.path }}" @isccArgs installer\monitoria-store-v103.iss
          if ($LASTEXITCODE -ne 0) { throw "Falha ao compilar/assinar MonitorIA Store 1.0.3." }

          Remove-Item Env:MONITORIA_SIGN_CONTEXT -ErrorAction SilentlyContinue

          if (-not (Test-Path dist\MonitorIA-Setup.exe)) { throw "MonitorIA-Setup.exe não foi criado." }
          if (-not (Test-Path dist-store-v103\MonitorIA-Store-Setup.exe)) { throw "MonitorIA-Store-Setup.exe não foi criado." }
          if ((Get-Item dist\MonitorIA-Setup.exe).Length -lt 5000000) { throw "Instalador 24/7 parece incompleto." }
          if ((Get-Item dist-store-v103\MonitorIA-Store-Setup.exe).Length -lt 5000000) { throw "Instalador Store parece incompleto." }

          if (-not (Test-Path -LiteralPath $signLog)) {
            throw "O Inno não registrou nenhuma chamada de assinatura."
          }

          $records = @(
            Get-Content -LiteralPath $signLog |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
              ForEach-Object { $_ | ConvertFrom-Json }
          )

          foreach ($expectation in @(
            @{ Context = "windows-247"; Setup = "MonitorIA-Setup.exe" },
            @{ Context = "windows-store"; Setup = "MonitorIA-Store-Setup.exe" }
          )) {
            $contextRecords = @($records | Where-Object { $_.context -eq $expectation.Context })
            if ($contextRecords.Count -lt 2) {
              throw "O Inno não assinou Setup + uninstaller no contexto $($expectation.Context)."
            }
            if (-not ($contextRecords | Where-Object { $_.fileName -eq $expectation.Setup })) {
              throw "Setup não passou pelo SignTool do Inno: $($expectation.Setup)"
            }
            if (-not ($contextRecords | Where-Object { $_.fileName -ne $expectation.Setup })) {
              throw "Uninstaller não passou pelo SignTool do Inno: $($expectation.Context)"
            }
            foreach ($record in $contextRecords) {
              if ($record.status -ne "Valid" -or -not $record.hasTimestamp) {
                throw "Registro de assinatura Inno inválido: $($record.fileName) / $($record.status)"
              }
            }
          }

      - name: Validar instalação silenciosa Store e consentimento opt-in
        shell: pwsh
        run: |
          $setup = Resolve-Path "dist-store-v103\MonitorIA-Store-Setup.exe"
          $storeRoot = Join-Path $env:LOCALAPPDATA "Programs\MonitorIA"
          $runPath = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"

          # Garante um estado limpo no runner e reproduz exatamente os parâmetros
          # planejados para o Partner Center.
          Remove-ItemProperty -Path $runPath -Name "MonitorIA" -ErrorAction SilentlyContinue
          if (Test-Path $storeRoot) { Remove-Item $storeRoot -Recurse -Force }

          $install = Start-Process `
            -FilePath $setup `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-") `
            -Wait `
            -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent install Store falhou: $($install.ExitCode)" }

          foreach ($required in @(
            "monitoria-store-launcher.exe",
            "monitoria-desktop.exe",
            "monitoria-agent.exe",
            "monitoria-dpapi.exe",
            "unins000.exe"
          )) {
            $target = Join-Path $storeRoot $required
            if (-not (Test-Path $target)) { throw "Silent install não criou $required." }
            $sig = Get-AuthenticodeSignature $target
            if ($sig.Status -ne 'Valid') { throw "PE instalado sem Authenticode válido: $required ($($sig.Status))" }
            if (-not $sig.TimeStamperCertificate) { throw "PE instalado sem timestamp: $required" }
          }

          $legacyRun = Get-ItemProperty -Path $runPath -Name "MonitorIA" -ErrorAction SilentlyContinue
          if ($null -ne $legacyRun) {
            throw "Silent install habilitou CurrentVersion\Run sem consentimento."
          }

          $unexpected = @(
            Get-Process -Name "monitoria-desktop", "monitoria-agent", "monitoria-store-launcher" -ErrorAction SilentlyContinue
          )
          if ($unexpected.Count -gt 0) {
            throw "Silent install abriu processos do MonitorIA automaticamente."
          }

          $launcher = Start-Process `
            -FilePath (Join-Path $storeRoot "monitoria-store-launcher.exe") `
            -ArgumentList "--self-test" `
            -WorkingDirectory $storeRoot `
            -Wait `
            -PassThru
          if ($launcher.ExitCode -ne 0) { throw "Launcher instalado falhou no self-test: $($launcher.ExitCode)" }

          $uninstaller = Join-Path $storeRoot "unins000.exe"
          $uninstall = Start-Process `
            -FilePath $uninstaller `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") `
            -Wait `
            -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstall Store falhou: $($uninstall.ExitCode)" }
          $deadline = (Get-Date).AddSeconds(15)
          while ((Test-Path $storeRoot) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
          }
          if (Test-Path $storeRoot) { throw "Silent uninstall não removeu a instalação Store." }
          $runAfterUninstall = Get-ItemProperty -Path $runPath -Name "MonitorIA" -ErrorAction SilentlyContinue
          if ($null -ne $runAfterUninstall) { throw "Uninstall deixou autostart do MonitorIA em HKCU." }

      - name: Validar instaladores assinados e montar artifacts RC
        shell: pwsh
        run: |
          foreach ($target in @("dist\MonitorIA-Setup.exe", "dist-store-v103\MonitorIA-Store-Setup.exe")) {
            $sig = Get-AuthenticodeSignature $target
            if ($sig.Status -ne 'Valid') { throw "Instalador sem assinatura válida: $target ($($sig.Status))" }
            if (-not $sig.TimeStamperCertificate) { throw "Instalador sem carimbo de tempo: $target" }
          }

          New-Item -ItemType Directory -Force -Path rc-windows-247 | Out-Null
          New-Item -ItemType Directory -Force -Path rc-windows-store | Out-Null
          Copy-Item dist\MonitorIA-Setup.exe rc-windows-247\MonitorIA-Setup.exe
          Copy-Item dist-store-v103\MonitorIA-Store-Setup.exe rc-windows-store\MonitorIA-Store-Setup.exe

          $coreHash = (Get-FileHash agent\dist\monitoria-agent.exe -Algorithm SHA256).Hash.ToLower()
          $setup247Hash = (Get-FileHash rc-windows-247\MonitorIA-Setup.exe -Algorithm SHA256).Hash.ToLower()
          $storeHash = (Get-FileHash rc-windows-store\MonitorIA-Store-Setup.exe -Algorithm SHA256).Hash.ToLower()

          @{
            version = $env:AGENT_VERSION
            candidate = "${{ inputs.candidate }}"
            commit = "${{ github.sha }}"
            channel = "windows"
            windowsCoreSha256 = $coreHash
            monitoria247Sha256 = $setup247Hash
            storeSha256 = $storeHash
            generatedAtUtc = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json | Out-File -Encoding utf8 rc-windows-manifest.json

          Copy-Item rc-windows-manifest.json rc-windows-247\MANIFEST-RC.json
          Copy-Item rc-windows-manifest.json rc-windows-store\MANIFEST-RC.json

      - name: Artifact RC Windows 24/7
        uses: actions/upload-artifact@v4
        with:
          name: monitoria-1.0.3-${{ inputs.candidate }}-windows-247
          path: rc-windows-247
          if-no-files-found: error
          retention-days: 14

      - name: Artifact RC Windows Store
        uses: actions/upload-artifact@v4
        with:
          name: monitoria-1.0.3-${{ inputs.candidate }}-windows-store
          path: rc-windows-store
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux ${{ matrix.arch }} RC
    needs: contract
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            bun_target: bun-linux-x64-baseline
            ffmpeg_asset: monitoria-ffmpeg-linux-x64-v1.tar.gz
            ffmpeg_sha256: d27ef4e034b31e0ddfeebf16af54742d50455139e57517da15207113665a78f8
          - arch: arm64
            runner: ubuntu-24.04-arm
            bun_target: bun-linux-aarch64
            ffmpeg_asset: monitoria-ffmpeg-linux-arm64-v1.tar.gz
            ffmpeg_sha256: c8c1cf0be6ca8f3b913b2733aa817743d9ea8211e36ef81075129f112d72f062

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true
      - run: npm ci
      - name: TypeScript do Agent
        run: npx tsc --noEmit -p agent/tsconfig.json

      - name: Compilar Core Linux 1.0.3
        working-directory: agent
        run: |
          bun build ./src/index-v103.ts --compile \
            --no-compile-autoload-dotenv \
            --no-compile-autoload-bunfig \
            --target=${{ matrix.bun_target }} \
            --outfile ./dist/monitoria-agent
          chmod +x ./dist/monitoria-agent
          ./dist/monitoria-agent self-test

      - name: Baixar e conferir FFmpeg Linux
        run: |
          set -euo pipefail
          BASE="https://github.com/BigCorps/MonitorIA/releases/download/agent-deps-v1"
          curl -fsSL -o ffmpeg.tar.gz "${BASE}/${{ matrix.ffmpeg_asset }}"
          HASH="$(sha256sum ffmpeg.tar.gz | cut -d' ' -f1)"
          test "$HASH" = "${{ matrix.ffmpeg_sha256 }}" || {
            echo "SHA256 divergente. Esperado ${{ matrix.ffmpeg_sha256 }}, obtido $HASH" >&2
            exit 1
          }
          mkdir -p ffmpeg-tmp
          tar xzf ffmpeg.tar.gz -C ffmpeg-tmp
          export LD_LIBRARY_PATH="$PWD/ffmpeg-tmp/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ffmpeg-tmp/ffmpeg -hide_banner -encoders 2>/dev/null | grep -q 'libopenh264'
          ! ffmpeg-tmp/ffmpeg -hide_banner -buildconf 2>&1 | grep -q -- '--enable-gpl'

      - name: Montar pacote Linux RC
        run: |
          set -euo pipefail
          OUT="monitoria-agent-linux-${{ matrix.arch }}"
          mkdir -p "$OUT/lib"
          cp agent/dist/monitoria-agent "$OUT/"
          cp ffmpeg-tmp/ffmpeg ffmpeg-tmp/ffprobe "$OUT/"
          cp -a ffmpeg-tmp/lib/. "$OUT/lib/"
          cp packaging/linux/monitoria-agent.service "$OUT/"
          cp packaging/linux/install.sh "$OUT/"
          chmod +x "$OUT/install.sh" "$OUT/monitoria-agent" "$OUT/ffmpeg" "$OUT/ffprobe"
          find ffmpeg-tmp -maxdepth 2 -name 'LICENSE*' -exec cp {} "$OUT/LICENSE.txt" \; || true
          cat > "$OUT/FFMPEG-ORIGEM.txt" <<ORIGIN
          FFmpeg redistribuído sem modificação.

          Origem : https://github.com/BigCorps/MonitorIA/releases/download/agent-deps-v1/${{ matrix.ffmpeg_asset }}
          SHA256 : ${{ matrix.ffmpeg_sha256 }}
          Licença: LGPL (build sem componentes GPL)
          Fonte  : https://github.com/BtbN/FFmpeg-Builds
          Upstream: https://git.ffmpeg.org/ffmpeg.git
          ORIGIN
          tar czf "${OUT}.tar.gz" "$OUT"

      - name: Validar instalação, reinício e upgrade-safe Linux
        run: |
          set -euo pipefail
          OUT="monitoria-agent-linux-${{ matrix.arch }}"
          sudo "${OUT}/install.sh" </dev/null
          systemd-analyze verify /etc/systemd/system/monitoria-agent.service
          systemctl is-enabled --quiet monitoria-agent.service
          systemctl is-active --quiet monitoria-agent.service
          test -x /opt/monitoria/monitoria-agent
          test -x /opt/monitoria/ffmpeg/ffmpeg
          test -d /var/lib/monitoria
          test "$(stat -c '%a' /var/lib/monitoria)" = "700"
          test "$(stat -c '%U' /var/lib/monitoria)" = "monitoria"

          sudo -u monitoria sh -c 'printf rc-upgrade-preserved > /var/lib/monitoria/upgrade-sentinel'
          sudo "${OUT}/install.sh" </dev/null
          sudo -u monitoria grep -q 'rc-upgrade-preserved' /var/lib/monitoria/upgrade-sentinel

          for _ in $(seq 1 30); do
            if sudo -u monitoria /opt/monitoria/monitoria-agent status >/tmp/monitoria-status.txt 2>&1; then
              break
            fi
            sleep 0.5
          done
          cat /tmp/monitoria-status.txt
          grep -q "MonitorIA Agent v${AGENT_VERSION}" /tmp/monitoria-status.txt

          sudo systemctl restart monitoria-agent.service
          sleep 1
          systemctl is-active --quiet monitoria-agent.service
          sudo -u monitoria /opt/monitoria/monitoria-agent status >/tmp/monitoria-status-after-restart.txt
          grep -q "MonitorIA Agent v${AGENT_VERSION}" /tmp/monitoria-status-after-restart.txt

      - name: Manifesto Linux RC
        run: |
          set -euo pipefail
          OUT="monitoria-agent-linux-${{ matrix.arch }}"
          PKG="${OUT}.tar.gz"
          CORE_SHA="$(sha256sum agent/dist/monitoria-agent | cut -d' ' -f1)"
          PKG_SHA="$(sha256sum "$PKG" | cut -d' ' -f1)"
          cat > MANIFEST-RC.json <<JSON
          {
            "version": "${AGENT_VERSION}",
            "candidate": "${{ inputs.candidate }}",
            "commit": "${{ github.sha }}",
            "channel": "linux-${{ matrix.arch }}",
            "coreSha256": "${CORE_SHA}",
            "packageSha256": "${PKG_SHA}"
          }
          JSON
          mkdir -p "artifact-linux-${{ matrix.arch }}"
          cp "$PKG" MANIFEST-RC.json "artifact-linux-${{ matrix.arch }}/"

      - name: Artifact RC Linux ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: monitoria-1.0.3-${{ inputs.candidate }}-linux-${{ matrix.arch }}
          path: artifact-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14

  manifest:
    name: Release Candidate Manifest
    needs:
      - windows
      - linux
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar todos os artifacts da execução
        uses: actions/download-artifact@v4
        with:
          path: rc-artifacts
          pattern: monitoria-1.0.3-${{ inputs.candidate }}-*

      - name: Validar conjunto e gerar SHA256SUMS
        run: |
          set -euo pipefail
          find rc-artifacts -maxdepth 4 -type f -print | sort

          test "$(find rc-artifacts -name MonitorIA-Setup.exe | wc -l)" -eq 1
          test "$(find rc-artifacts -name MonitorIA-Store-Setup.exe | wc -l)" -eq 1
          test "$(find rc-artifacts -name 'monitoria-agent-linux-x64.tar.gz' | wc -l)" -eq 1
          test "$(find rc-artifacts -name 'monitoria-agent-linux-arm64.tar.gz' | wc -l)" -eq 1

          mkdir -p final-manifest
          (
            cd rc-artifacts
            find . -type f ! -name MANIFEST-RC.json -print0 | sort -z | xargs -0 sha256sum
          ) > final-manifest/SHA256SUMS.txt

          cat > final-manifest/RELEASE-CANDIDATE.json <<JSON
          {
            "version": "${AGENT_VERSION}",
            "candidate": "${{ inputs.candidate }}",
            "commit": "${{ github.sha }}",
            "runId": "${{ github.run_id }}",
            "runAttempt": "${{ github.run_attempt }}",
            "publication": false,
            "tagCreated": false,
            "storePublicUrlConfiguredByThisWorkflow": false
          }
          JSON
          cp final-manifest/RELEASE-CANDIDATE.json final-manifest/MANIFEST-RC.json

      - name: Publicar manifesto temporário da RC
        uses: actions/upload-artifact@v4
        with:
          name: monitoria-1.0.3-${{ inputs.candidate }}-manifest
          path: final-manifest
          if-no-files-found: error
          retention-days: 14
