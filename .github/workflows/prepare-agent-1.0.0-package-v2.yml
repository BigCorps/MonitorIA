name: Preparar patch MonitorIA Agent 1.0.0 v2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparar:
    name: Validar e empacotar patch 1.0.0
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Atualizar versão para 1.0.0
        run: node scripts/bump-agent-version.mjs 1.0.0

      - name: Trocar dependências FFmpeg pelos bundles permanentes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: esperado 1 ocorrência, encontrado {count}")
              return text.replace(old, new, 1)

          win_path = Path(".github/workflows/build-agent.yml")
          win = win_path.read_text(encoding="utf-8")

          win = replace_once(
              win,
              'FFMPEG_URL: "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-01-13-21/ffmpeg-n8.1.2-34-g9b6c8969e0-win64-lgpl-shared-8.1.zip"',
              'FFMPEG_URL: "https://github.com/BigCorps/MonitorIA/releases/download/agent-deps-v1/monitoria-ffmpeg-win64-lgpl-shared-v1.zip"',
              "URL FFmpeg Windows",
          )
          win = replace_once(
              win,
              'FFMPEG_SHA256: "3bba81dcfd017a6ea1627905549769913948831ef10f3e7df7541f736067bff8"',
              'FFMPEG_SHA256: "e12b6bab3636a9056803cbfc107a4bc724504c1c75a7bbc8aa43c876fb59d02b"',
              "SHA FFmpeg Windows",
          )

          old_stage = "\n".join([
              "          Copy-Item build\\monitoria-dpapi.exe   sign-stage\\ -Force",
              "          Copy-Item build\\monitoria-service.exe sign-stage\\ -Force",
              "          Copy-Item build\\ffmpeg\\*.exe          sign-stage\\ -Force",
              "          Copy-Item build\\ffmpeg\\*.dll          sign-stage\\ -Force",
          ])
          new_stage = "\n".join([
              "          Copy-Item build\\monitoria-dpapi.exe   sign-stage\\ -Force",
              "          Copy-Item build\\monitoria-service.exe sign-stage\\ -Force",
          ])
          win = replace_once(win, old_stage, new_stage, "stage de assinatura Windows")

          old_return = "\n".join([
              "          Copy-Item sign-stage-signed\\monitoria-dpapi.exe   build\\        -Force",
              "          Copy-Item sign-stage-signed\\monitoria-service.exe build\\        -Force",
              "          Copy-Item sign-stage-signed\\ffmpeg.exe            build\\ffmpeg\\ -Force",
              "          Copy-Item sign-stage-signed\\ffprobe.exe           build\\ffmpeg\\ -Force",
              "          Copy-Item sign-stage-signed\\*.dll                 build\\ffmpeg\\ -Force",
              "",
              "          $alvos = @(",
              '            "build\\monitoria-dpapi.exe",',
              '            "build\\monitoria-service.exe",',
              '            "build\\ffmpeg\\ffmpeg.exe",',
              '            "build\\ffmpeg\\ffprobe.exe"',
              "          )",
              "          foreach ($alvo in $alvos) {",
              "            $status = (Get-AuthenticodeSignature $alvo).Status",
              '            if ($status -ne \'Valid\') { throw "Binario sem assinatura valida: $alvo ($status)" }',
              "          }",
          ])
          new_return = "\n".join([
              "          Copy-Item sign-stage-signed\\monitoria-dpapi.exe   build\\ -Force",
              "          Copy-Item sign-stage-signed\\monitoria-service.exe build\\ -Force",
              "",
              "          $alvos = @(",
              '            "build\\monitoria-dpapi.exe",',
              '            "build\\monitoria-service.exe",',
              '            "build\\ffmpeg\\ffmpeg.exe",',
              '            "build\\ffmpeg\\ffprobe.exe"',
              "          ) + @(",
              "            Get-ChildItem build\\ffmpeg -File -Filter *.dll |",
              "              ForEach-Object { $_.FullName }",
              "          )",
              "",
              "          foreach ($alvo in $alvos) {",
              "            $status = (Get-AuthenticodeSignature $alvo).Status",
              '            if ($status -ne \'Valid\') { throw "Binario sem assinatura valida: $alvo ($status)" }',
              "          }",
          ])
          win = replace_once(win, old_return, new_return, "devolução dos binários Windows")

          win_path.write_text(win, encoding="utf-8")

          linux_path = Path(".github/workflows/build-agent-linux.yml")
          linux = linux_path.read_text(encoding="utf-8")
          dollar = "$"
          matrix_asset = dollar + "{{ matrix.ffmpeg_asset }}"

          replacements = [
              ("ffmpeg-n8.1.2-34-g9b6c8969e0-linux64-lgpl-shared-8.1.tar.xz", "monitoria-ffmpeg-linux-x64-v1.tar.gz", "bundle Linux x64"),
              ("e9144cae41096aba50d7c6caba0d15822ad04f9f3a97f394cecd7bb93eae68b8", "d27ef4e034b31e0ddfeebf16af54742d50455139e57517da15207113665a78f8", "SHA Linux x64"),
              ("ffmpeg-n8.1.2-34-g9b6c8969e0-linuxarm64-lgpl-shared-8.1.tar.xz", "monitoria-ffmpeg-linux-arm64-v1.tar.gz", "bundle Linux arm64"),
              ("9279602b39d14c0446209b3b70f42b497d3edf8b252c926d3f342902d9357d02", "c8c1cf0be6ca8f3b913b2733aa817743d9ea8211e36ef81075129f112d72f062", "SHA Linux arm64"),
              ('BASE="https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-01-13-21"', 'BASE="https://github.com/BigCorps/MonitorIA/releases/download/agent-deps-v1"', "base URL Linux"),
              ('curl -fsSL -o ffmpeg.tar.xz "${BASE}/' + matrix_asset + '"', 'curl -fsSL -o ffmpeg.tar.gz "${BASE}/' + matrix_asset + '"', "download Linux"),
              ('HASH="$(sha256sum ffmpeg.tar.xz | cut -d\' \' -f1)"', 'HASH="$(sha256sum ffmpeg.tar.gz | cut -d\' \' -f1)"', "hash Linux"),
              ("mkdir -p ffmpeg-tmp && tar xf ffmpeg.tar.xz -C ffmpeg-tmp --strip-components=1", "mkdir -p ffmpeg-tmp && tar xzf ffmpeg.tar.gz -C ffmpeg-tmp", "extração Linux"),
              ('cp ffmpeg-tmp/bin/ffmpeg ffmpeg-tmp/bin/ffprobe "$OUT/"', 'cp ffmpeg-tmp/ffmpeg ffmpeg-tmp/ffprobe "$OUT/"', "executáveis Linux"),
              ("Origem : " + matrix_asset, "Origem : https://github.com/BigCorps/MonitorIA/releases/download/agent-deps-v1/" + matrix_asset, "proveniência Linux"),
          ]

          for old, new, label in replacements:
              linux = replace_once(linux, old, new, label)

          linux_path.write_text(linux, encoding="utf-8")

      - name: Verificar consistência da versão
        run: node scripts/bump-agent-version.mjs --check

      - name: Garantir dependências permanentes
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq "releases/download/autobuild-2026-08-01-13-21" .github/workflows/build-agent.yml
          ! grep -Fq "releases/download/autobuild-2026-08-01-13-21" .github/workflows/build-agent-linux.yml
          grep -Fq 'AGENT_VERSION: "1.0.0"' .github/workflows/build-agent.yml
          grep -Fq 'AGENT_VERSION: "1.0.0"' .github/workflows/build-agent-linux.yml
          grep -Fq "e12b6bab3636a9056803cbfc107a4bc724504c1c75a7bbc8aa43c876fb59d02b" .github/workflows/build-agent.yml
          grep -Fq "d27ef4e034b31e0ddfeebf16af54742d50455139e57517da15207113665a78f8" .github/workflows/build-agent-linux.yml
          grep -Fq "c8c1cf0be6ca8f3b913b2733aa817743d9ea8211e36ef81075129f112d72f062" .github/workflows/build-agent-linux.yml

      - name: TypeScript
        run: npm run check

      - name: Testes
        run: npm test

      - name: Montar ZIP somente com arquivos alterados
        shell: python
        run: |
          from pathlib import Path
          import shutil
          import subprocess
          import zipfile

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=ACM"],
              text=True,
          ).splitlines()

          if not changed:
              raise SystemExit("Nenhum arquivo foi alterado.")

          patch_root = Path("MonitorIA-Agent-1.0.0-Patch")
          patch_root.mkdir()

          for rel in changed:
              src = Path(rel)
              if not src.is_file():
                  continue
              dst = patch_root / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)

          (patch_root / "ARQUIVOS-ALTERADOS.txt").write_text(
              "\n".join(changed) + "\n",
              encoding="utf-8",
          )
          (patch_root / "LEIA-ME.txt").write_text(
              "MonitorIA Agent 1.0.0 - patch validado pelo GitHub Actions.\n"
              "Aplique preservando os caminhos. Não crie a tag agent-v1.0.0 ainda.\n",
              encoding="utf-8",
          )

          zip_path = Path("MonitorIA-Agent-1.0.0-Patch.zip")
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as zf:
              for file in patch_root.rglob("*"):
                  if file.is_file():
                      zf.write(file, file.relative_to(patch_root.parent))

          print("Arquivos alterados:")
          for rel in changed:
              print(" -", rel)

      - name: Publicar patch validado
        uses: actions/upload-artifact@v4
        with:
          name: MonitorIA-Agent-1.0.0-Patch
          path: MonitorIA-Agent-1.0.0-Patch.zip
          if-no-files-found: error
          retention-days: 30

      - name: Resumo
        shell: bash
        run: |
          echo "## Patch Agent 1.0.0 validado" >> "$GITHUB_STEP_SUMMARY"
          echo "Baixe o artefato MonitorIA-Agent-1.0.0-Patch." >> "$GITHUB_STEP_SUMMARY"
          echo "O repositório não foi alterado por este workflow." >> "$GITHUB_STEP_SUMMARY"
