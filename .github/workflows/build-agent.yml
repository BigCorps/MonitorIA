name: Build MonitorIA Agent

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "agent/**"
      - "app/api/agent/cameras/**"
      - "app/api/agent/config/**"
      - "src/lib/agent-camera.ts"
      - ".github/workflows/build-agent.yml"

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 baseline
    runs-on: windows-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: agent

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instalar Bun baseline 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-download-url: "https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-windows-x64-baseline.zip"
          no-cache: true

      - name: Confirmar runtime baseline
        shell: pwsh
        run: |
          bun --version
          bun --revision
          Write-Host "Runtime Bun: $((Get-Command bun).Source)"

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Confirmar código-fonte do Agent
        shell: pwsh
        run: |
          if (-not (Test-Path "src/index.ts")) {
            throw "agent/src/index.ts não foi encontrado."
          }

          $sourceFiles = Get-ChildItem src -Filter *.ts
          if ($sourceFiles.Count -lt 13) {
            throw "Código-fonte incompleto: $($sourceFiles.Count) arquivos."
          }

          $sourceFiles | Select-Object Name

      - name: Verificar TypeScript
        run: bun run check

      - name: Gerar executável
        run: bun run build:win

      - name: Validar executável
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/monitoria-agent.exe"
          $size = (Get-Item $exe).Length

          if ($size -lt 1000000) {
            throw "Executável incompleto: $size bytes."
          }

          & $exe self-test
          if ($LASTEXITCODE -ne 0) {
            throw "O autoteste falhou."
          }

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: monitoria-agent-windows-x64-baseline-v0.7.3
          path: agent/dist/monitoria-agent.exe
          if-no-files-found: error
          retention-days: 30
