name: Build Agent RTSP Sampler Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Agent Windows x64 RTSP Test
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Aplicar correção RTSP somente neste runner
        shell: pwsh
        run: |
          @'
          const fs = require("fs");

          const file = "agent/src/motion.ts";
          let source = fs.readFileSync(file, "utf8");

          function replaceOnce(from, to, label) {
            const first = source.indexOf(from);
            if (first < 0) throw new Error(`Trecho não encontrado: ${label}`);
            if (source.indexOf(from, first + from.length) >= 0) {
              throw new Error(`Trecho duplicado inesperadamente: ${label}`);
            }
            source = source.slice(0, first) + to + source.slice(first + from.length);
          }

          // O filtro fps depende dos timestamps entregues pelo RTSP.
          // Alguns equipamentos mantêm o stream vivo, mas entregam timestamps
          // que fazem o filtro repetir o mesmo quadro por longos períodos.
          // O Agent passa a receber os frames reais e amostra pelo relógio local.
          replaceOnce(
            '      `fps=1/${interval}`,\n      `scale=${MOTION_WIDTH}:${MOTION_HEIGHT}:force_original_aspect_ratio=decrease`,',
            '      `scale=${MOTION_WIDTH}:${MOTION_HEIGHT}:force_original_aspect_ratio=decrease`,',
            "remover filtro fps"
          );

          replaceOnce(
            '  let previous: Buffer | null = null;\n  let stderr = "";',
            '  let previous: Buffer | null = null;\n  let lastSampleAt = 0;\n  const sampleIntervalMs = interval * 1000;\n  let stderr = "";',
            "estado de amostragem"
          );

          replaceOnce(
            '      if (previous) {\n        try {',
            '      const sampleAt = Date.now();\n\n      // Não usa PTS/DTS do RTSP para decidir quando amostrar. Quadros\n      // intermediários continuam sendo drenados do pipe, mas a comparação\n      // usa o último quadro realmente amostrado pelo relógio do Agent.\n      if (previous && sampleAt - lastSampleAt < sampleIntervalMs) {\n        continue;\n      }\n\n      if (previous) {\n        try {',
            "throttle por relógio local"
          );

          replaceOnce(
            '      previous = frame;\n    }\n  });',
            '      previous = frame;\n      lastSampleAt = sampleAt;\n    }\n  });',
            "marcar horário da amostra"
          );

          fs.writeFileSync(file, source, "utf8");
          console.log("Correção RTSP aplicada somente no workspace do runner.");
          '@ | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\patch-motion.cjs"

          node "$env:RUNNER_TEMP\patch-motion.cjs"

      - name: Preparar versão 1.0.2 somente neste runner
        shell: pwsh
        run: node scripts/bump-agent-version.mjs 1.0.2

      - name: Instalar Bun baseline 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-download-url: "https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-windows-x64-baseline.zip"
          no-cache: true

      - name: Instalar dependências
        run: npm ci

      - name: Verificar TypeScript
        run: npx tsc --noEmit -p agent/tsconfig.json

      - name: Gerar Agent Windows
        shell: pwsh
        run: |
          Push-Location agent
          try {
            bun run build:win
            if ($LASTEXITCODE -ne 0) { throw "Falha ao compilar o Agent." }
          }
          finally {
            Pop-Location
          }

          $exe = Resolve-Path "agent\dist\monitoria-agent.exe"
          if ((Get-Item $exe).Length -lt 1000000) {
            throw "Executável incompleto."
          }

      - name: Assinar Agent 1.0.2
        uses: sslcom/esigner-codesign@v1.3.2
        with:
          command: sign
          username: ${{ secrets.ESIGNER_USERNAME }}
          password: ${{ secrets.ESIGNER_PASSWORD }}
          credential_id: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ESIGNER_TOTP_SECRET }}
          file_path: ${{ github.workspace }}\agent\dist\monitoria-agent.exe
          output_path: ${{ github.workspace }}\agent-test-signed
          malware_block: true
          environment_name: PROD

      - name: Preparar pacote de teste
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item "agent-test-signed\monitoria-agent.exe" "artifact\monitoria-agent.exe" -Force

          $sig = Get-AuthenticodeSignature "artifact\monitoria-agent.exe"
          if ($sig.Status -ne "Valid") {
            throw "Agent de teste sem assinatura válida: $($sig.Status)"
          }

          @'
          @echo off
          setlocal
          title MonitorIA Agent 1.0.2 - RTSP Sampler Test

          net session >nul 2>&1
          if not "%errorlevel%"=="0" (
            echo Execute este arquivo como Administrador.
            pause
            exit /b 1
          )

          set "DIR=C:\Program Files\MonitorIA"
          set "CURRENT=%DIR%\monitoria-agent.exe"
          set "BACKUP=%DIR%\monitoria-agent-before-rtsp-sampler-test.exe"
          set "NEW=%~dp0monitoria-agent.exe"

          if not exist "%NEW%" (
            echo ERRO: monitoria-agent.exe nao encontrado ao lado deste CMD.
            pause
            exit /b 1
          )

          echo Parando MonitorIA Agent...
          sc stop MonitorIAAgent >nul 2>&1
          timeout /t 3 /nobreak >nul

          if exist "%CURRENT%" (
            copy /y "%CURRENT%" "%BACKUP%" >nul
          )

          copy /y "%NEW%" "%CURRENT%" >nul
          if errorlevel 1 (
            echo ERRO ao substituir o Agent.
            pause
            exit /b 1
          )

          echo Iniciando MonitorIA Agent 1.0.2...
          sc start MonitorIAAgent >nul 2>&1
          timeout /t 5 /nobreak >nul

          echo.
          echo Agent RTSP 1.0.2 instalado.
          echo Pareamento, RTSP, cameras e configuracoes foram preservados.
          echo Avise no ChatGPT: "1.0.2 rtsp instalado"
          echo.
          pause
          '@ | Set-Content -Encoding ascii "artifact\INSTALAR-AGENT-RTSP-1.0.2.cmd"

          @'
          @echo off
          setlocal
          title Restaurar MonitorIA Agent anterior

          net session >nul 2>&1
          if not "%errorlevel%"=="0" (
            echo Execute este arquivo como Administrador.
            pause
            exit /b 1
          )

          set "DIR=C:\Program Files\MonitorIA"
          set "CURRENT=%DIR%\monitoria-agent.exe"
          set "BACKUP=%DIR%\monitoria-agent-before-rtsp-sampler-test.exe"

          if not exist "%BACKUP%" (
            echo ERRO: backup do Agent anterior nao encontrado.
            pause
            exit /b 1
          )

          sc stop MonitorIAAgent >nul 2>&1
          timeout /t 3 /nobreak >nul
          copy /y "%BACKUP%" "%CURRENT%" >nul
          if errorlevel 1 (
            echo ERRO ao restaurar o Agent anterior.
            pause
            exit /b 1
          )

          sc start MonitorIAAgent >nul 2>&1
          timeout /t 5 /nobreak >nul

          echo Agent anterior restaurado.
          pause
          '@ | Set-Content -Encoding ascii "artifact\RESTAURAR-AGENT-ANTERIOR.cmd"

          @'
          MonitorIA Agent 1.0.2 - teste RTSP

          Hipotese testada:
          O filtro fps do FFmpeg depende dos timestamps PTS/DTS do RTSP.
          Em alguns equipamentos o stream permanece conectado, mas o filtro
          repete quadros antigos. A captura pontual continua atualizada, enquanto
          o monitor continuo enxerga quase zero movimento.

          Mudanca:
          - remove fps=1/interval do filtro FFmpeg;
          - drena os frames reais do stream;
          - faz a amostragem pelo relogio local do Agent;
          - nao altera thresholds, IA, trial, fila, video ou pareamento.

          Este build e somente para teste.
          '@ | Set-Content -Encoding utf8 "artifact\LEIA-ME.txt"

      - name: Publicar Agent RTSP Test
        uses: actions/upload-artifact@v4
        with:
          name: MonitorIA-Agent-1.0.2-RTSP-Sampler-Test
          path: artifact/
          if-no-files-found: error
          retention-days: 7
