name: Build MonitorIA Agent

on:
  workflow_dispatch:
  push:
    tags:
      - "agent-v*"

permissions:
  contents: write

env:
  AGENT_VERSION: "1.0.2"
  PUBLISHER_NAME: "BIGCORPS TECNOLOGIA LTA"
  FFMPEG_URL: "https://github.com/BigCorps/MonitorIA/releases/download/agent-deps-v1/monitoria-ffmpeg-win64-lgpl-shared-v1.zip"
  FFMPEG_SHA256: "e12b6bab3636a9056803cbfc107a4bc724504c1c75a7bbc8aa43c876fb59d02b"
  WINSW_URL: "https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW.NET461.exe"
  WINSW_SHA256: "b5066b7bbdfba1293e5d15cda3caaea88fbeab35bd5b38c41c913d492aadfc4f"

jobs:
  build-windows:
    name: Instalador Windows x64
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar Bun baseline 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-download-url: "https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-windows-x64-baseline.zip"
          no-cache: true

      - name: Instalar dependências
        run: npm ci

      - name: Verificar TypeScript
        run: npx tsc --noEmit -p agent/tsconfig.json

      - name: Testar transporte autenticado 1.0.2
        run: node --import tsx --test test/agent-0102-http-redirect.test.ts

      - name: Gerar Agent 1.0.2 e componente de segurança
        shell: pwsh
        run: |
          Push-Location agent
          try {
            bun run build:win
            if ($LASTEXITCODE -ne 0) { throw "Falha ao compilar o Agent." }
          }
          finally {
            Pop-Location
          }

          New-Item -ItemType Directory -Force -Path build | Out-Null
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudio = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($visualStudio)) { throw "Ferramentas C++ do Visual Studio não encontradas." }

          $vcvars = Join-Path $visualStudio "VC\Auxiliary\Build\vcvars64.bat"
          $command = '"' + $vcvars + '" && cl.exe /nologo /O2 /W4 /DUNICODE /D_UNICODE agent\native\dpapi.c /Fe:build\monitoria-dpapi.exe Crypt32.lib'
          cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw "Falha ao compilar o componente DPAPI." }

          Copy-Item build\monitoria-dpapi.exe agent\dist\monitoria-dpapi.exe

      - name: Validar executável 1.0.2
        working-directory: agent
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/monitoria-agent.exe"
          $dpapi = Resolve-Path "dist/monitoria-dpapi.exe"
          if ((Get-Item $exe).Length -lt 1000000) { throw "Executável incompleto." }
          if ((Get-Item $dpapi).Length -lt 10000) { throw "Componente de segurança incompleto." }
          & $exe self-test
          if ($LASTEXITCODE -ne 0) { throw "O autoteste falhou." }

      - name: Baixar e conferir FFmpeg LGPL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/ffmpeg | Out-Null
          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile ffmpeg.zip
          $hash = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:FFMPEG_SHA256) { throw "SHA256 do FFmpeg divergente. Esperado $env:FFMPEG_SHA256, obtido $hash." }

          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp

          foreach ($name in @("ffmpeg.exe", "ffprobe.exe")) {
            $source = Get-ChildItem ffmpeg-tmp -Recurse -Filter $name | Select-Object -First 1
            if (-not $source) { throw "$name não encontrado no pacote do FFmpeg." }
            Copy-Item $source.FullName "build/ffmpeg/$name"
          }

          Get-ChildItem ffmpeg-tmp -Recurse -Filter *.dll | ForEach-Object {
            Copy-Item $_.FullName "build/ffmpeg/$($_.Name)"
          }

          $license = Get-ChildItem ffmpeg-tmp -Recurse -Filter LICENSE.txt | Select-Object -First 1
          if (-not $license) { throw "LICENSE.txt do FFmpeg não encontrado." }
          Copy-Item $license.FullName build/ffmpeg/LICENSE.txt

          @"
          FFmpeg redistribuído sem modificação.

          Origem : $env:FFMPEG_URL
          SHA256 : $env:FFMPEG_SHA256
          Licença: LGPL (build sem componentes GPL)
          Fonte  : https://github.com/BtbN/FFmpeg-Builds
          Upstream: https://git.ffmpeg.org/ffmpeg.git
          "@ | Out-File -Encoding utf8 build/ffmpeg/FFMPEG-ORIGEM.txt

      - name: Validar encoder de compressão da 1.0.2
        shell: pwsh
        run: |
          $ffmpeg = Resolve-Path "build/ffmpeg/ffmpeg.exe"
          $encoders = & $ffmpeg -hide_banner -encoders 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg não iniciou corretamente." }
          if ($encoders -notmatch 'libopenh264') { throw "FFmpeg LGPL sem libopenh264: compressão seletiva da 1.0.2 ficaria indisponível." }

          $buildConf = & $ffmpeg -hide_banner -buildconf 2>&1 | Out-String
          if ($buildConf -match '--enable-gpl') { throw "Bundle FFmpeg inesperadamente GPL." }

      - name: Baixar e conferir WinSW
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:WINSW_URL -OutFile build/monitoria-service.exe
          $hash = (Get-FileHash build/monitoria-service.exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:WINSW_SHA256) { throw "SHA256 do WinSW divergente. Esperado $env:WINSW_SHA256, obtido $hash." }

      - name: Verificar credenciais de assinatura
        id: signing
        shell: pwsh
        env:
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
        run: |
          $enabled = -not [string]::IsNullOrWhiteSpace($env:ESIGNER_USERNAME)
          "enabled=$($enabled.ToString().ToLower())" | Out-File -Append $env:GITHUB_OUTPUT

          if ($enabled) {
            $faltando = @()
            if ([string]::IsNullOrWhiteSpace($env:ESIGNER_PASSWORD)) { $faltando += "ESIGNER_PASSWORD" }
            if ([string]::IsNullOrWhiteSpace($env:ESIGNER_CREDENTIAL_ID)) { $faltando += "ESIGNER_CREDENTIAL_ID" }
            if ([string]::IsNullOrWhiteSpace($env:ESIGNER_TOTP_SECRET)) { $faltando += "ESIGNER_TOTP_SECRET" }
            if ($faltando.Count -gt 0) { throw "Credenciais incompletas. Faltando: $($faltando -join ', ')" }
            Write-Host "Credenciais de assinatura presentes."
            return
          }

          if ("${{ github.ref }}".StartsWith("refs/tags/agent-v")) {
            throw "Release em tag exige assinatura, e os segredos do eSigner não estão configurados."
          }

          Write-Warning "Sem credenciais de assinatura. O build sairá sem assinar e NÃO deve ser distribuído."

      - name: Reunir binários para assinatura
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path sign-stage | Out-Null
          Copy-Item build\monitoria-dpapi.exe sign-stage\ -Force
          Copy-Item build\monitoria-service.exe sign-stage\ -Force

      - name: Assinar binários auxiliares
        if: steps.signing.outputs.enabled == 'true'
        uses: sslcom/esigner-codesign@v1.3.2
        with:
          command: batch_sign
          username: ${{ secrets.ESIGNER_USERNAME }}
          password: ${{ secrets.ESIGNER_PASSWORD }}
          credential_id: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ESIGNER_TOTP_SECRET }}
          dir_path: ${{ github.workspace }}\sign-stage
          output_path: ${{ github.workspace }}\sign-stage-signed
          malware_block: true
          environment_name: PROD

      - name: Devolver binários assinados
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          Copy-Item sign-stage-signed\monitoria-dpapi.exe build\ -Force
          Copy-Item sign-stage-signed\monitoria-service.exe build\ -Force

          $alvos = @(
            "build\monitoria-dpapi.exe",
            "build\monitoria-service.exe",
            "build\ffmpeg\ffmpeg.exe",
            "build\ffmpeg\ffprobe.exe"
          ) + @(Get-ChildItem build\ffmpeg -File -Filter *.dll | ForEach-Object { $_.FullName })

          foreach ($alvo in $alvos) {
            $status = (Get-AuthenticodeSignature $alvo).Status
            if ($status -ne 'Valid') { throw "Binário sem assinatura válida: $alvo ($status)" }
          }

      - name: Assinar o executável do Agent
        if: steps.signing.outputs.enabled == 'true'
        uses: sslcom/esigner-codesign@v1.3.2
        with:
          command: sign
          username: ${{ secrets.ESIGNER_USERNAME }}
          password: ${{ secrets.ESIGNER_PASSWORD }}
          credential_id: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ESIGNER_TOTP_SECRET }}
          file_path: ${{ github.workspace }}\agent\dist\monitoria-agent.exe
          output_path: ${{ github.workspace }}\agent-signed
          malware_block: true
          environment_name: PROD

      - name: Devolver o Agent assinado
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          Copy-Item agent-signed\monitoria-agent.exe agent\dist\ -Force
          $signature = Get-AuthenticodeSignature "agent\dist\monitoria-agent.exe"
          if ($signature.Status -ne 'Valid') { throw "Agent sem assinatura válida: $($signature.Status)" }
          if (-not $signature.TimeStamperCertificate) { throw "Agent assinado sem carimbo de tempo." }

      - name: Validar pacote final que irá ao instalador
        shell: pwsh
        run: |
          # O helper usado no primeiro autoteste era a cópia pré-assinatura.
          # A partir daqui o Agent usa exatamente o DPAPI que será empacotado.
          Copy-Item build\monitoria-dpapi.exe agent\dist\monitoria-dpapi.exe -Force

          $agent = Resolve-Path "agent\dist\monitoria-agent.exe"
          $dpapi = Resolve-Path "agent\dist\monitoria-dpapi.exe"

          & $agent self-test
          if ($LASTEXITCODE -ne 0) { throw "Autoteste do pacote final falhou." }

          # Não execute o helper diretamente com "& $dpapi": o GitHub Actions
          # trata qualquer exit code nativo diferente de zero como falha do
          # passo antes de conseguirmos validar o código. Sem argumentos, o
          # helper DEVE sair com 2; Start-Process permite inspecionar esse
          # código sem o PowerShell abortar o job.
          $dpapiProcess = Start-Process `
            -FilePath $dpapi.Path `
            -Wait `
            -PassThru

          if ($dpapiProcess.ExitCode -ne 2) {
            throw "Helper DPAPI final não iniciou como esperado. Código: $($dpapiProcess.ExitCode)"
          }

          Write-Host "Helper DPAPI final iniciou corretamente (código esperado 2 sem argumentos)."

          if ('${{ steps.signing.outputs.enabled }}' -eq 'true') {
            foreach ($alvo in @($agent.Path, $dpapi.Path, (Resolve-Path "build\monitoria-service.exe").Path)) {
              $sig = Get-AuthenticodeSignature $alvo
              if ($sig.Status -ne 'Valid') { throw "Binário final sem assinatura válida: $alvo ($($sig.Status))" }
              if (-not $sig.TimeStamperCertificate) { throw "Binário final sem carimbo de tempo: $alvo" }
            }
          }

      - name: Localizar o Inno Setup
        id: inno
        shell: pwsh
        run: |
          $candidatos = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )

          $iscc = $candidatos | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = $candidatos | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "Não foi possível localizar o ISCC.exe." }
          "path=$iscc" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Preparar assinatura do Inno Setup
        if: steps.signing.outputs.enabled == 'true'
        id: inno_sign
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODE_SIGN_TOOL_PATH)) {
            throw "CodeSignTool não ficou disponível após a assinatura dos binários."
          }

          $wrapper = Join-Path $env:RUNNER_TEMP "monitoria-inno-sign.ps1"
          @'
          param([Parameter(Mandatory=$true)][string]$FilePath)
          $ErrorActionPreference = 'Stop'
          $tool = Join-Path $env:CODE_SIGN_TOOL_PATH 'CodeSignTool.bat'
          if (-not (Test-Path $tool)) { throw "CodeSignTool.bat não encontrado." }
          if (-not (Test-Path $FilePath)) { throw "Arquivo para assinatura não encontrado: $FilePath" }

          $workDir = Join-Path $env:RUNNER_TEMP ("monitoria-inno-sign-" + [guid]::NewGuid().ToString('N'))
          $outDir = Join-Path $workDir 'signed'
          $inputExe = Join-Path $workDir 'monitoria-sign-input.exe'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          try {
            Copy-Item $FilePath $inputExe -Force
            $args = @(
              'sign',
              "-username=$env:ESIGNER_USERNAME",
              "-password=$env:ESIGNER_PASSWORD",
              "-credential_id=$env:ESIGNER_CREDENTIAL_ID",
              "-totp_secret=$env:ESIGNER_TOTP_SECRET",
              "-input_file_path=$inputExe",
              "-output_dir_path=$outDir",
              '-malware_block=true'
            )
            & $tool @args
            if ($LASTEXITCODE -ne 0) { throw "CodeSignTool falhou com código $LASTEXITCODE." }

            $signed = Join-Path $outDir ([IO.Path]::GetFileName($inputExe))
            if (-not (Test-Path $signed)) { throw "eSigner não devolveu o arquivo assinado." }

            $sig = Get-AuthenticodeSignature $signed
            if ($sig.Status -ne 'Valid') { throw "Assinatura inválida: $($sig.Status)" }
            if (-not $sig.TimeStamperCertificate) { throw "Assinatura sem carimbo de tempo." }
            Copy-Item $signed $FilePath -Force
          }
          finally {
            Remove-Item $workDir -Recurse -Force -ErrorAction SilentlyContinue
          }
          '@ | Set-Content -Path $wrapper -Encoding utf8
          "wrapper=$wrapper" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Compilar os instaladores 1.0.2
        shell: pwsh
        env:
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
        run: |
          $iscc = "${{ steps.inno.outputs.path }}"

          if ('${{ steps.signing.outputs.enabled }}' -eq 'true') {
            $wrapper = "${{ steps.inno_sign.outputs.wrapper }}"
            $pwsh = (Get-Command pwsh.exe -ErrorAction Stop).Source
            $signCommand = '$q' + $pwsh + '$q -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $q' + $wrapper + '$q $f'
            & $iscc "/DAppVersion=$env:AGENT_VERSION" "/DSignCommand=1" "/Smonitoria=$signCommand" "installer\monitoria.iss"
          }
          else {
            & $iscc "/DAppVersion=$env:AGENT_VERSION" "installer\monitoria.iss"
          }
          if ($LASTEXITCODE -ne 0) { throw "Falha ao compilar o instalador retail." }

          if ('${{ steps.signing.outputs.enabled }}' -eq 'true') {
            $wrapper = "${{ steps.inno_sign.outputs.wrapper }}"
            $pwsh = (Get-Command pwsh.exe -ErrorAction Stop).Source
            $signCommand = '$q' + $pwsh + '$q -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $q' + $wrapper + '$q $f'
            & $iscc "/DAppVersion=$env:AGENT_VERSION" "/DStoreBuild=1" "/DSignCommand=1" "/Smonitoria=$signCommand" "installer\monitoria.iss"
          }
          else {
            & $iscc "/DAppVersion=$env:AGENT_VERSION" "/DStoreBuild=1" "installer\monitoria.iss"
          }
          if ($LASTEXITCODE -ne 0) { throw "Falha ao compilar o instalador Microsoft Store." }

      - name: Validar upgrade Windows e instaladores
        shell: pwsh
        env:
          EDITOR_ESPERADO: ${{ env.PUBLISHER_NAME }}
        run: |
          $assinando = '${{ steps.signing.outputs.enabled }}' -eq 'true'
          $alvos = @(
            @{ Nome = "Retail"; Caminho = "dist\MonitorIA-Setup.exe" },
            @{ Nome = "Microsoft Store"; Caminho = "dist\MonitorIA-Store-Setup.exe" }
          )
          $falhas = @()

          @"
          | Instalador | Tamanho | Assinatura | Carimbo | SHA256 |
          |---|---|---|---|---|
          "@ | Out-File -Append $env:GITHUB_STEP_SUMMARY

          foreach ($alvo in $alvos) {
            if (-not (Test-Path $alvo.Caminho)) {
              $falhas += "$($alvo.Nome): arquivo não gerado"
              continue
            }

            $arquivo = Get-Item $alvo.Caminho
            $mb = [math]::Round($arquivo.Length / 1MB, 1)
            $hash = (Get-FileHash $arquivo.FullName -Algorithm SHA256).Hash.ToLower()
            $assinatura = Get-AuthenticodeSignature $arquivo.FullName
            $status = $assinatura.Status
            $carimbo = if ($assinatura.TimeStamperCertificate) { "sim" } else { "NAO" }

            "| $($alvo.Nome) | $mb MB | $status | $carimbo | ``$hash`` |" | Out-File -Append $env:GITHUB_STEP_SUMMARY

            if (-not $assinando) { continue }
            if ($status -ne 'Valid') { $falhas += "$($alvo.Nome): assinatura inválida ($status)" }
            if (-not $assinatura.TimeStamperCertificate) { $falhas += "$($alvo.Nome): sem carimbo de tempo" }
            if ($assinatura.SignerCertificate -and $assinatura.SignerCertificate.Subject -notmatch [regex]::Escape($env:EDITOR_ESPERADO)) {
              $falhas += "$($alvo.Nome): editor divergente: $($assinatura.SignerCertificate.Subject)"
            }
            if ($assinatura.SignerCertificate -and $assinatura.SignerCertificate.NotAfter -lt (Get-Date).AddDays(30)) {
              $falhas += "$($alvo.Nome): certificado expira em menos de 30 dias"
            }
          }

          if ($falhas.Count -gt 0) {
            throw "Validação dos instaladores falhou:`n - $($falhas -join "`n - ")"
          }

      - name: Provar upgrade 1.0.2 preservando estado local
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'

          $setup = (Resolve-Path "dist\MonitorIA-Setup.exe").Path
          $logDir = Join-Path $env:RUNNER_TEMP 'monitoria-install-logs'
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null

          function Invoke-MonitorIAInstaller {
            param(
              [Parameter(Mandatory=$true)][string]$FilePath,
              [Parameter(Mandatory=$true)][string[]]$Arguments,
              [Parameter(Mandatory=$true)][string]$Label,
              [int]$TimeoutSeconds = 180
            )

            Write-Host ">>> $Label iniciada."
            $process = Start-Process -FilePath $FilePath -ArgumentList $Arguments -PassThru

            try {
              $finished = $process.WaitForExit($TimeoutSeconds * 1000)
              if (-not $finished) {
                & taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null
                throw "$Label excedeu o timeout de ${TimeoutSeconds}s."
              }

              $process.Refresh()
              if ($process.ExitCode -ne 0) { throw "$Label falhou com código $($process.ExitCode)." }
              Write-Host "<<< $Label terminou com sucesso."
            }
            finally {
              $process.Dispose()
            }
          }

          function Show-InstallLogs {
            Get-ChildItem $logDir -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "===== $($_.Name) (últimas 200 linhas) ====="
              Get-Content $_.FullName -Tail 200 -ErrorAction SilentlyContinue
            }
          }

          function Show-AgentLogs {
            $serviceLogDir = Join-Path $env:ProgramData 'MonitorIA\logs'
            if (-not (Test-Path $serviceLogDir)) { return }

            Get-ChildItem $serviceLogDir -File -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "===== Log do Agent: $($_.Name) ====="
              Get-Content $_.FullName -Tail 100 -ErrorAction SilentlyContinue
            }
          }

          function Assert-AgentInstalledAndRunning {
            param([Parameter(Mandatory=$true)][string]$Stage)

            $agentPath = Join-Path $env:ProgramFiles 'MonitorIA\monitoria-agent.exe'
            $deadline = (Get-Date).AddSeconds(60)
            $lastStatus = ''
            $lastServiceState = 'não encontrado'

            do {
              $service = Get-Service -Name 'MonitorIAAgent' -ErrorAction SilentlyContinue
              if ($service) { $lastServiceState = $service.Status.ToString() }

              if ((Test-Path $agentPath) -and $service -and $service.Status -eq 'Running') {
                $statusLines = & $agentPath status 2>&1
                $statusExitCode = $LASTEXITCODE
                $lastStatus = $statusLines | Out-String

                if ($statusExitCode -eq 0 -and $lastStatus -match 'MonitorIA Agent v1\.0\.2') {
                  Write-Host ">>> ${Stage}: serviço e IPC prontos."
                  Write-Host $lastStatus

                  # Valida o Agent instalado usando o helper DPAPI que saiu de
                  # dentro do instalador, não uma cópia do workspace.
                  #
                  # IMPORTANTE: em PowerShell, toda saída não capturada dentro de
                  # uma função passa a fazer parte do valor retornado. Se executarmos
                  # "& $agentPath self-test" diretamente, as linhas do autoteste
                  # entram junto com o caminho retornado e transformam $agent em um
                  # array/string inválido na etapa seguinte.
                  $selfTestLines = & $agentPath self-test 2>&1
                  $selfTestExitCode = $LASTEXITCODE
                  $selfTestLines | ForEach-Object { Write-Host $_ }

                  if ($selfTestExitCode -ne 0) {
                    throw "${Stage}: autoteste do Agent instalado falhou."
                  }

                  return $agentPath
                }
              }

              Start-Sleep -Seconds 1
            }
            while ((Get-Date) -lt $deadline)

            Write-Host "Estado final do SCM: $lastServiceState"
            if ($lastStatus) {
              Write-Host "Última resposta do Agent:"
              Write-Host $lastStatus
            }

            Write-Host "Diagnóstico do serviço:"
            & sc.exe query MonitorIAAgent 2>&1 | Out-String | Write-Host
            Show-AgentLogs

            throw "$Stage instalou o Agent, mas ele não ficou pronto para responder pelo IPC em até 60 segundos."
          }

          $baseArgs = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-')

          try {
            $firstLog = Join-Path $logDir '01-primeira-instalacao.log'
            $firstArgs = $baseArgs + @("/LOG=`"$firstLog`"")
            Invoke-MonitorIAInstaller -FilePath $setup -Arguments $firstArgs -Label 'Primeira instalação 1.0.2'
            $agent = Assert-AgentInstalledAndRunning -Stage 'Primeira instalação'

            $data = Join-Path $env:ProgramData 'MonitorIA'
            New-Item -ItemType Directory -Force -Path $data | Out-Null
            $sentinel = Join-Path $data 'upgrade-sentinel-1.0.1'
            Set-Content -Path $sentinel -Value 'pairing-config-queue-history-preserved' -Encoding utf8

            $secondLog = Join-Path $logDir '02-reinstalacao-upgrade.log'
            $secondArgs = $baseArgs + @("/LOG=`"$secondLog`"")
            Invoke-MonitorIAInstaller -FilePath $setup -Arguments $secondArgs -Label 'Reinstalação/upgrade 1.0.2'
            $agent = Assert-AgentInstalledAndRunning -Stage 'Reinstalação/upgrade'

            if (-not (Test-Path $sentinel)) { throw "Upgrade apagou ProgramData\MonitorIA." }
            if ((Get-Content $sentinel -Raw) -notmatch 'preserved') { throw "Upgrade alterou o estado local." }

            $statusLines = & $agent status 2>&1
            $statusExitCode = $LASTEXITCODE
            $status = $statusLines | Out-String
            Write-Host $status

            if ($statusExitCode -ne 0 -or $status -notmatch 'MonitorIA Agent v1\.0\.2') {
              throw "Upgrade instalou versão errada ou o serviço deixou de responder. Saída: $status"
            }

            $uninstaller = Join-Path $env:ProgramFiles 'MonitorIA\unins000.exe'
            if (-not (Test-Path $uninstaller)) { throw "Desinstalador não foi criado." }

            $uninstallLog = Join-Path $logDir '03-desinstalacao.log'
            $uninstallArgs = $baseArgs + @("/LOG=`"$uninstallLog`"")
            Invoke-MonitorIAInstaller -FilePath $uninstaller -Arguments $uninstallArgs -Label 'Desinstalação de validação' -TimeoutSeconds 120

            if (Test-Path $data) { throw "Desinstalação explícita não removeu ProgramData\MonitorIA." }
            Write-Host "Upgrade-safe Windows aprovado."
          }
          catch {
            Show-InstallLogs
            Show-AgentLogs
            throw
          }

      - name: Publicar diagnóstico de instalação Windows
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MonitorIA-Windows-install-diagnostics-${{ env.AGENT_VERSION }}
          path: ${{ runner.temp }}/monitoria-install-logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: MonitorIA-Setup-${{ env.AGENT_VERSION }}
          path: dist/MonitorIA-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publicar artefato Microsoft Store
        uses: actions/upload-artifact@v4
        with:
          name: MonitorIA-Store-Setup-${{ env.AGENT_VERSION }}
          path: dist/MonitorIA-Store-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/agent-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MonitorIA-Setup.exe
            dist/MonitorIA-Store-Setup.exe
          fail_on_unmatched_files: true
